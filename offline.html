<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline | Biblia Sacra</title>
	
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- External Libraries (Cached by your Service Worker) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts Expansion -->
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Theme Initialization Script -->
    <script>
        // Apply saved theme and accent color immediately to prevent flashing
        try {
            const savedSettings = JSON.parse(localStorage.getItem('bible_settings'));
            if (savedSettings) {
                if (savedSettings.theme === 'light') {
                    document.documentElement.classList.remove('dark');
                }
                if (savedSettings.accentColor) {
                    document.documentElement.style.setProperty('--color-primary', savedSettings.accentColor.color);
                    document.documentElement.style.setProperty('--color-primary-hover', savedSettings.accentColor.hover);
                    document.documentElement.style.setProperty('--color-primary-glow', savedSettings.accentColor.glow);
                }
            }
        } catch(e) {}
    </script>

    <!-- Tailwind 3D Glass Morphism & AMOLED Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amoled: '#000000',
                        primary: 'var(--color-primary)',
                        'primary-hover': 'var(--color-primary-hover)',
                        'primary-glow': 'var(--color-primary-glow)',
                    },
                    boxShadow: {
                        'glass-light': '0 8px 32px 0 rgba(31, 38, 135, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.8)',
                        'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05)',
                        '3d-btn': '0 4px 6px -1px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.25)',
                        'glow-primary': '0 0 20px var(--color-primary-glow)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Accent Colors (Default: Indigo) */
            --color-primary: #4f46e5;
            --color-primary-hover: #4338ca;
            --color-primary-glow: rgba(79, 70, 229, 0.4);
        }

        /* Ambient AMOLED Background Elements */
        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
            transition: opacity 0.5s ease;
        }
        .dark .ambient-blob {
            opacity: 0.05;
        }

        html.dark { color-scheme: dark; }
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        html.dark body {
            background-color: #000000;
            color: #f3f4f6;
        }

        /* 3D Glass Morphism Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        .dark .glass-panel {
            background: rgba(15, 15, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        /* Dynamic SVG Mask for App Icon */
        .header-icon-mask {
            background-color: var(--color-primary);
            -webkit-mask: url('./sancta.svg') no-repeat center;
            mask: url('./sancta.svg') no-repeat center;
            -webkit-mask-size: contain;
            mask-size: contain;
            transition: background-color 0.5s ease;
            filter: drop-shadow(0 4px 6px var(--color-primary-glow));
        }
        .dark .header-icon-mask {
            filter: drop-shadow(0 0 12px var(--color-primary-glow));
        }

        /* 3D Buttons */
        .btn-primary {
            background: var(--color-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover {
            background: var(--color-primary-hover);
            box-shadow: 0 0 20px var(--color-primary-glow), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="transition-colors duration-500 antialiased selection:bg-primary/30 overflow-hidden flex items-center justify-center h-screen w-full relative z-10 p-4">

    <!-- Background Blobs -->
    <div class="ambient-blob bg-blue-400 w-96 h-96 top-[-10%] left-[-10%]"></div>
    <div class="ambient-blob bg-purple-400 w-96 h-96 bottom-[-10%] right-[-10%]"></div>

    <!-- Main Offline Panel -->
    <main class="glass-panel w-full max-w-lg p-8 md:p-12 flex flex-col items-center text-center relative overflow-hidden animate-fade-in-up">
        
        <!-- Subtle background glow behind icon -->
        <div class="absolute top-10 w-32 h-32 bg-primary/20 rounded-full blur-3xl z-0"></div>

        <!-- Logo / Icon -->
        <div class="relative z-10 flex flex-col items-center justify-center mb-8">
            <div class="header-icon-mask h-10 w-40 mb-6" aria-label="Sancta Logo"></div>
            
            <!-- Disconnected Icon -->
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-800 dark:to-gray-900 shadow-inner flex items-center justify-center transform -rotate-3 border border-gray-100 dark:border-gray-700">
                <svg class="w-10 h-10 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M18.364 5.636a9 9 0 00-12.728 0M21.172 2.828a12.963 12.963 0 00-18.344 0M15.536 8.464a5 5 0 012.828 4.243M12 12v.01M8.464 15.536a5 5 0 00-4.243 2.828"></path>
                </svg>
            </div>
        </div>

        <h1 class="relative z-10 text-3xl font-bold mb-3 text-gray-900 dark:text-white tracking-tight drop-shadow-sm">
            You're Offline
        </h1>
        
        <p class="relative z-10 text-gray-500 dark:text-gray-400 mb-10 max-w-sm">
            It looks like you've lost your internet connection. Please check your network and try again.
        </p>

        <!-- Refresh Button -->
        <button onclick="window.location.reload()" class="relative z-10 w-full btn-primary font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-2 text-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Refresh Connection
        </button>

    </main>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</body>
</html>
